<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optometrist Bridge</title>
<style>
  :root { --bg:#f6f7f8; --card:#fff; --fg:#1b1f23; --muted:#5f6b76; --line:#dde2e6; --teal:#00796b; --red:#b3261e; --amber:#9a6200; --new:#1565c0; --okbg:#e8f5e9; --ok:#1b5e20; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121417; --card:#1c2024; --fg:#e8eaed; --muted:#9aa4ad; --line:#2e343a; --teal:#4db6ac; --red:#f2b8b5; --amber:#ffcc80; --new:#90caf9; --okbg:#1e3324; --ok:#a5d6a7; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; flex:1; min-width:200px; }
  main { display:grid; grid-template-columns:minmax(260px, 380px) 1fr; gap:16px; padding:16px; max-width:1240px; margin:0 auto; }
  @media (max-width: 760px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  .list button { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:10px 6px; color:inherit; font:inherit; cursor:pointer; }
  .list button:hover, .list button.sel { background:color-mix(in srgb, var(--teal) 10%, transparent); }
  .list button.isnew { border-left:4px solid var(--new); }
  .case { font-weight:700; font-size:16px; letter-spacing:.5px; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid currentColor; margin-left:6px; }
  .tag.newtag { background:var(--new); color:#fff; border-color:var(--new); font-weight:700; }
  .waiting { color:var(--amber); } .reviewed { color:var(--teal); } .urgent { color:var(--red); } .demo { color:var(--red); }
  .muted { color:var(--muted); font-size:13px; }
  h2 { font-size:16px; margin:16px 0 6px; }
  .bigcase { font-size:28px; font-weight:800; letter-spacing:1px; margin:0; }
  .summary { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin:10px 0; }
  .summary div { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .summary b { display:block; font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  table { border-collapse:collapse; width:100%; } td { border-top:1px solid var(--line); padding:4px 6px; vertical-align:top; word-break:break-word; }
  td:first-child { color:var(--muted); width:40%; }
  details summary { cursor:pointer; margin-top:12px; font-weight:600; }
  textarea { width:100%; min-height:140px; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:inherit; }
  input[type=password] { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:inherit; }
  .btn { background:var(--teal); color:#fff; border:0; border-radius:8px; padding:9px 16px; font:inherit; cursor:pointer; }
  .btn.secondary { background:none; color:var(--teal); border:1px solid var(--teal); }
  .note { border-left:3px solid var(--amber); padding:6px 10px; margin:8px 0; }
  .flag { border-left:3px solid var(--red); padding:6px 10px; margin:8px 0; color:var(--red); font-weight:600; }
  .list button.urgentrow { border-left:4px solid var(--red); background:color-mix(in srgb, var(--red) 9%, transparent); }
  .tag.urgentfill { background:var(--red); color:#fff; border-color:var(--red); font-weight:700; }
  .tag.child { color:var(--amber); font-weight:700; }
  .banner { background:var(--red); color:#fff; border-radius:10px; padding:12px 14px; margin:10px 0; font-weight:600; }
  .banner ul { margin:6px 0 0 18px; padding:0; font-weight:500; }
  .rings { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:8px 0; }
  .ring { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; background:var(--muted); }
  .dot.OK { background:#1e9e6a; } .dot.WATCH { background:#e8a317; } .dot.URGENT { background:var(--red); }
  .lensitem { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; }
  .lensitem b { display:block; }
  .confirm { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin:8px 0; }
  .confirm input { width:100%; font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:inherit; }
  .sent { background:var(--okbg); color:var(--ok); border-radius:8px; padding:10px 12px; margin-top:10px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Drishti Saathi · Optometrist Bridge</h1>
  <label class="muted">Token <input type="password" id="token" placeholder="if the server needs one"></label>
  <button class="btn secondary" id="sound" title="Browsers only play sound after a click on the page">Sound: off</button>
  <button class="btn secondary" id="refresh">Refresh</button>
</header>
<main>
  <section class="card">
    <div class="muted" id="count">Loading…</div>
    <div class="muted" id="updated"></div>
    <div class="list" id="list"></div>
  </section>
  <section class="card" id="detail"><p class="muted">Open a case on the left. The list refreshes every 10 seconds; new cases get a NEW badge.</p></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let selected = null;
let known = null;          // ids seen in the previous refresh (null = first load)
let soundOn = false;
let audio = null;

// ---- per-browser memory: token and which cases were opened (for the NEW badge) ----
function getStore(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }
function setStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function openedSet() { try { return new Set(JSON.parse(getStore("openedCases", "[]"))); } catch (e) { return new Set(); } }
function markOpened(id) { const s = openedSet(); s.add(id); setStore("openedCases", JSON.stringify([...s].slice(-500))); }

$("token").value = getStore("bridgeToken", "");
$("token").addEventListener("change", () => { setStore("bridgeToken", $("token").value); known = null; load(); });

// ---- sound: a short two-tone beep (browsers allow audio only after a click, hence the button) ----
$("sound").onclick = () => {
  soundOn = !soundOn;
  $("sound").textContent = "Sound: " + (soundOn ? "on" : "off");
  if (soundOn) { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); beep(); } catch (e) {} }
};
function beep() {
  if (!soundOn || !audio) return;
  [0, 0.18].forEach((t, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = i ? 1046 : 784; g.gain.value = 0.15;
    o.connect(g); g.connect(audio.destination);
    o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.15);
  });
}

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  const t = $("token").value.trim();
  if (t) headers["X-Bridge-Token"] = t;
  const r = await fetch(path, Object.assign({}, opts, { headers }));
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return r.status === 204 ? null : r.json();
}

function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
function when(ms) { return ms ? new Date(ms).toLocaleString() : ""; }
const PROBLEM = { DISTANCE: "Far", NEAR: "Near", BOTH: "Far and near", NONE: "No trouble" };
const SOURCE = { KNOWN_POWER: "Customer's known power", PHONE_ESTIMATE: "Phone quick estimate (approximate)",
                 MEASURED: "Phone far-point test", OLD_GLASSES_NUMBERS: "Old glasses numbers" };
const problem = (p) => p ? (PROBLEM[p] || p) : "—";
const source = (s) => s ? (SOURCE[s] || s) : "None (no power estimate)";
const nice = (s) => String(s).replace(/_/g, " ").toLowerCase();

async function load() {
  try {
    const rows = await api("/profiles");
    const opened = openedSet();
    const ids = new Set(rows.map(r => r.id));
    const arrived = known ? rows.filter(r => !known.has(r.id)) : [];
    known = ids;
    if (arrived.length) beep();
    const fresh = rows.filter(r => !opened.has(r.id)).length;
    document.title = (fresh ? "(" + fresh + " new) " : "") + "Optometrist Bridge";
    $("count").textContent = rows.length + " case(s) · " + rows.filter(r => r.status === "WAITING").length + " waiting · " + fresh + " new";
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString() + " · refreshes every 10 s";
    const list = $("list"); list.replaceChildren();
    rows.forEach(r => {
      const isNew = !opened.has(r.id);
      const b = el("button"); b.className = (r.id === selected ? "sel " : "") + (r.tag === "URGENT" ? "urgentrow " : "") + (isNew ? "isnew" : "");
      const top = el("div");
      top.append(el("span", "Case #" + (r.caseId || r.id.slice(0, 6).toUpperCase()), "case"));
      if (isNew) top.append(el("span", "NEW", "tag newtag"));
      top.append(el("span", r.status === "WAITING" ? "Waiting" : "Reviewed", "tag " + (r.status === "WAITING" ? "waiting" : "reviewed")));
      if (r.tag === "URGENT") top.append(el("span", "URGENT", "tag urgentfill"));
      else if (r.tag === "CHILD_MYOPIA") top.append(el("span", "Child myopia", "tag child"));
      else if (r.referralLevel && r.referralLevel !== "NONE") top.append(el("span", nice(r.referralLevel) + " referral", "tag waiting"));
      if (r.demo) top.append(el("span", "DEMO", "tag demo"));
      b.append(top);
      b.append(el("div", "Age " + (r.age ?? "?") + " · " + problem(r.visionProblem) + (r.dominantZone ? " · mostly " + nice(r.dominantZone) : "")));
      if ((r.redFlagReasons || []).length) b.append(el("div", r.redFlagReasons.join(" · "), "urgent"));
      b.append(el("div", when(r.receivedAt) + " · " + source(r.powerSource), "muted"));
      b.onclick = () => open(r.id);
      list.append(b);
    });
  } catch (e) { $("count").textContent = "Could not load: " + e.message; }
}

function table(obj) {
  const t = el("table");
  Object.entries(obj || {}).forEach(([k, v]) => {
    if (v === null || v === undefined) return;
    const tr = el("tr"); tr.append(el("td", k));
    tr.append(el("td", typeof v === "object" ? JSON.stringify(v) : String(v)));
    t.append(tr);
  });
  return t;
}

function box(label, value) { const d = el("div"); d.append(el("b", label), document.createTextNode(value)); return d; }

function powerLines(p) {
  const pw = p.power || {}, out = [];
  (pw.eyes || []).forEach(e => {
    const s = e.startingTrialLens && e.startingTrialLens.value, b = e.band && e.band.value;
    let t = (e.eye === "RIGHT" ? "R" : e.eye === "LEFT" ? "L" : e.eye) + ": ";
    t += s ? "starting trial lens " + s.sph + (s.cyl ? " / " + s.cyl + (s.axis != null ? " × " + s.axis : "") : "") : "—";
    if (b) t += " (estimated band " + b.lowD + " to " + b.highD + ")";
    if (e.phoneNoMyopiaAtReach) t += " (still clear at arm's length)";
    out.push(t);
  });
  if (pw.addD && pw.addD.value) out.push("Add: " + pw.addD.value.lowD + " to " + pw.addD.value.highD);
  return out;
}

// A ring drawn as an SVG arc: score 0-100.
function ringSvg(score, colour) {
  const ns = "http://www.w3.org/2000/svg", r = 16, c = 2 * Math.PI * r;
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", "44"); svg.setAttribute("height", "44"); svg.setAttribute("viewBox", "0 0 44 44");
  const mk = (stroke, dash) => { const o = document.createElementNS(ns, "circle"); o.setAttribute("cx", "22"); o.setAttribute("cy", "22"); o.setAttribute("r", String(r));
    o.setAttribute("fill", "none"); o.setAttribute("stroke", stroke); o.setAttribute("stroke-width", "6"); if (dash != null) { o.setAttribute("stroke-dasharray", dash + " " + c);
    o.setAttribute("transform", "rotate(-90 22 22)"); o.setAttribute("stroke-linecap", "round"); } return o; };
  svg.append(mk("#8884", null), mk(colour, c * Math.max(0, Math.min(100, score)) / 100));
  return svg;
}

// The grid as it was shown, with the squares the person tapped.
function amslerSvg(a) {
  const ns = "http://www.w3.org/2000/svg", q = 9, w = a.columns * q, h = a.rows * q;
  const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", String(w + 2)); svg.setAttribute("height", String(h + 2));
  svg.setAttribute("viewBox", "-1 -1 " + (w + 2) + " " + (h + 2)); svg.style.background = "#fff";
  (a.cells || []).forEach(c => { const r = document.createElementNS(ns, "rect"); r.setAttribute("x", String(c.col * q)); r.setAttribute("y", String(c.row * q));
    r.setAttribute("width", String(q)); r.setAttribute("height", String(q)); r.setAttribute("fill", "#d93838"); r.setAttribute("opacity", "0.6"); svg.append(r); });
  for (let i = 0; i <= a.columns; i++) { const l = document.createElementNS(ns, "line"); l.setAttribute("x1", String(i * q)); l.setAttribute("x2", String(i * q)); l.setAttribute("y1", "0"); l.setAttribute("y2", String(h)); l.setAttribute("stroke", "#222"); l.setAttribute("stroke-width", "0.6"); svg.append(l); }
  for (let j = 0; j <= a.rows; j++) { const l = document.createElementNS(ns, "line"); l.setAttribute("y1", String(j * q)); l.setAttribute("y2", String(j * q)); l.setAttribute("x1", "0"); l.setAttribute("x2", String(w)); l.setAttribute("stroke", "#222"); l.setAttribute("stroke-width", "0.6"); svg.append(l); }
  const dot = document.createElementNS(ns, "circle"); dot.setAttribute("cx", String(w / 2)); dot.setAttribute("cy", String(h / 2)); dot.setAttribute("r", "2"); svg.append(dot);
  return svg;
}

const RING_COLOUR = { work: "#2f80ed", digital: "#a3d33a", mobility: "#6b7785", leisure: "#f2a93b" };

async function open(id) {
  selected = id;
  markOpened(id);
  const d = $("detail"); d.replaceChildren(el("p", "Loading…", "muted"));
  try {
    const { profile: p, review, receivedAt, caseId, tag } = await api("/profiles/" + id);
    const tri = p.triage || {}, vp = p.visionProfile, scr = p.screening, lens = p.lens;
    const a = p.answers || {}, fp = p.functionalProfile || {}, est = p.estimates || {};
    d.replaceChildren();
    d.append(el("p", "Case #" + (caseId || id.slice(0, 6).toUpperCase()), "bigcase"));
    d.append(el("div", "Received " + when(receivedAt) + " · no name or photo is ever sent · phone values are estimates, confirmed with the trial lens", "muted"));
    if (p.demo) d.append(el("div", "DEMO session: sample customer, not a real person.", "note"));

    // ---- urgent first: the red-flag reasons at the top ----
    if (tag === "URGENT") {
      const b = el("div", "URGENT: the customer was told to see an eye doctor today. No lens was suggested.", "banner");
      const ul = el("ul"); (tri.redFlagReasons || []).forEach(r => ul.append(el("li", r))); if (ul.children.length) b.append(ul);
      if (tri.emergency) b.append(el("div", "Emergency signs: short check only (power of each eye and the grid)."));
      d.append(b);
    } else if (tag === "CHILD_MYOPIA") {
      d.append(el("div", "CHILD MYOPIA: under 18 with minus power. The power was measured; no lens was chosen. Please check for myopia control.", "note"));
    }

    // ---- at a glance ----
    const sum = el("div", null, "summary");
    sum.append(box("Age", a.age != null ? String(a.age) : "?"));
    sum.append(box("Problem", problem(a.visionProblem)));
    sum.append(box("Functional vision (hours / day)",
      "near " + (fp.nearHours ?? "?") + " · intermediate " + (fp.intermediateHours ?? "?") + " · distance " + (fp.distanceHours ?? "?")));
    sum.append(box("Main zone → lens", (fp.dominant ? nice(fp.dominant) : "?") + " → " + (fp.impliedLens ? nice(fp.impliedLens) : "?")));
    sum.append(box("Power source", source(p.powerSource)));
    sum.append(box("Referral", est.referralLevel ? nice(est.referralLevel) : "none"));
    d.append(sum);

    const flags = [];
    if (est.referralLevel === "URGENT") flags.push("URGENT referral: the app stopped lens advice.");
    (est.referralReasons || []).forEach(r => flags.push("Flag: " + (typeof r === "object" ? JSON.stringify(r) : nice(r))));
    if (a.redFlagFlashes) flags.push("Red flag: flashes / floaters / curtain");
    if (a.redFlagOther) flags.push("Red flag: sudden vision loss, pain, redness or double vision");
    if (a.diabetesOrBp) flags.push("Diabetes or BP");
    flags.forEach(f => d.append(el("div", f, "flag")));

    // ---- measurements and how they were taken ----
    const pr = (p.power || {}).phoneRange || {};
    if (pr.right || pr.left || pr.near) {
      d.append(el("h2", "Phone measurement and method" + (tri.powerLabel ? " · " + tri.powerLabel : "")));
      if (pr.right) d.append(el("div", "R: " + pr.right));
      if (pr.left) d.append(el("div", "L: " + pr.left));
      if (pr.near) d.append(el("div", pr.near));
    }
    const pd = (p.measurements || {}).pdMm;
    if (pd && pd.value != null) d.append(el("div", "PD: about " + Math.round(pd.value * 10) / 10 + " mm (" + nice(pd.source || "") + ")", "muted"));
    const pl = powerLines(p);
    if (pl.length) { d.append(el("h2", "Power (" + source(p.powerSource) + ")")); pl.forEach(t => d.append(el("div", t))); }

    // ---- vision profile rings ----
    if (vp) {
      d.append(el("h2", "Vision profile"));
      const rings = el("div", null, "rings");
      ["work", "digital", "mobility", "leisure"].forEach(k => {
        const r = vp[k]; if (!r) return;
        const box = el("div", null, "ring"); box.append(ringSvg(r.answered ? r.score : 0, RING_COLOUR[k]));
        const t = el("div"); t.append(el("b", k.charAt(0).toUpperCase() + k.slice(1)), el("div", r.answered ? r.label + " (" + r.score + ")" : "not answered"));
        box.append(t); rings.append(box);
      });
      d.append(rings);
      if (vp.nightGlareSensitive) d.append(el("div", "Night-glare sensitive", "note"));
    }

    // ---- screening ----
    if (scr) {
      d.append(el("h2", "Screening tests"));
      d.append(el("div", scr.label || "Screening, not a diagnosis", "muted"));
      (scr.lines || []).forEach(l => { const row = el("div"); const dot = el("span", null, "dot " + (l.status || "")); row.append(dot, document.createTextNode(l.text)); d.append(row); });
      ((scr.results || {}).amsler || []).filter(a => a.distortion).forEach(a => {
        d.append(el("div", "Grid, " + (a.eye === "RIGHT" ? "right" : "left") + " eye: squares the person tapped (" + a.columns + " × " + a.rows + " shown, 5 mm each, at about " + Math.round((a.distanceMm || 300) / 10) + " cm)", "flag"));
        d.append(amslerSvg(a));
      });
    }

    // ---- lens suggestion ----
    if (lens) {
      d.append(el("h2", lens.suggested ? (lens.label || "Suggested lens family") : "Lens suggestion"));
      if (!lens.suggested) d.append(el("div", "None: referral only." + (lens.referralInfo ? " For the referral: " + lens.referralInfo + "." : ""), "note"));
      if (lens.optometristConfirms) d.append(el("div", "Child without myopia: optometrist confirms.", "note"));
      (lens.items || []).forEach(it => {
        const box = el("div", null, "lensitem"); box.append(el("b", nice(it.kind) + ": " + it.product));
        (it.why || []).forEach(w => box.append(el("div", "✓ " + w)));
        d.append(box);
      });
    }

    // ---- reply ----
    d.append(el("h2", "Your advice to the shop"));
    if (review.status === "REVIEWED") d.append(el("div", "Replied " + when(review.reviewedAt) + ". Submitting again replaces it.", "muted"));
    const ta = el("textarea"); ta.maxLength = 4000; ta.value = review.advice || ""; d.append(ta);
    d.append(el("div", "Confirm or correct the power (optional), e.g. -4.25 / -0.50 x 180", "muted"));
    const cp = review.confirmedPower || {}, conf = el("div", null, "confirm"), inputs = {};
    const startOf = (eye) => { const e = ((p.power || {}).eyes || []).find(x => x.eye === eye); const s = e && e.startingTrialLens && e.startingTrialLens.value; return s ? String(s.sph.toFixed(2)) : ""; };
    [["right", "Right eye", startOf("RIGHT")], ["left", "Left eye", startOf("LEFT")], ["add", "Add", ""]].forEach(([k, label, hint]) => {
      const w = el("label", label); const i = el("input"); i.type = "text"; i.maxLength = k === "add" ? 20 : 40; i.value = cp[k] || ""; i.placeholder = hint ? "phone: " + hint : "";
      w.append(i); conf.append(w); inputs[k] = i;
    });
    d.append(conf);
    const lab = el("label"); const cb = el("input"); cb.type = "checkbox"; cb.checked = !!review.needsInPersonExam;
    lab.append(cb, document.createTextNode(" Needs an in-person eye exam"));
    const flagRow = el("div"); flagRow.append(lab); d.append(flagRow);
    const btn = el("button", "Submit advice", "btn"); const msg = el("div", "", "muted");
    btn.onclick = async () => {
      if (!ta.value.trim()) { msg.className = "muted"; msg.textContent = "Write some advice first."; return; }
      btn.disabled = true;
      try {
        const confirmed = {}; Object.entries(inputs).forEach(([k, i]) => { if (i.value.trim()) confirmed[k] = i.value.trim(); });
        const body = { advice: ta.value, needsInPersonExam: cb.checked };
        if (Object.keys(confirmed).length) body.confirmedPower = confirmed;
        await api("/profiles/" + id + "/review", { method: "POST", body: JSON.stringify(body) });
        msg.className = "sent";
        msg.textContent = "Reply sent to the shop. It appears on the shop's phone within about 15 seconds.";
        load();
      } catch (e) { msg.className = "muted"; msg.textContent = "Failed: " + e.message; }
      btn.disabled = false;
    };
    const row = el("div"); row.style.marginTop = "10px"; row.append(btn); d.append(row, msg);

    // ---- everything else ----
    [["Survey answers", (p.survey || {}).values], ["Estimates (lens, referral, notes)", p.estimates], ["Power values", p.power], ["Functional vision profile", p.functionalProfile],
     ["Measurements", p.measurements], ["Interview answers", p.answers], ["Consent", p.consent]].forEach(([title, obj]) => {
      const det = el("details"); det.append(el("summary", title), table(obj)); d.append(det);
    });
  } catch (e) { d.replaceChildren(el("p", "Could not open: " + e.message, "muted")); }
  load();
}

$("refresh").onclick = load;
load();
setInterval(load, 10000);
</script>
</body>
</html>
