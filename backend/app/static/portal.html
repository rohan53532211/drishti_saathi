<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drishti Saathi · Optometrist portal</title>
<style>
@font-face { font-family: "Inter Deva"; src: url("/portal/assets/inter_deva_regular.ttf"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Inter Deva"; src: url("/portal/assets/inter_deva_semibold.ttf"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Inter Deva"; src: url("/portal/assets/inter_deva_bold.ttf"); font-weight: 700; font-display: swap; }
:root {
  --bg:#F7F9FC; --surface:#FFFFFF; --hairline:#E3E8EF; --ink:#0B1B2B; --ink2:#5A6B7D;
  --primary:#1A5CFF; --primary-pressed:#0B3FCC; --on-primary:#FFFFFF; --primary-soft:#E8EFFF;
  --success:#1E9E6A; --success-ink:#136B47; --success-soft:#E5F6EE;
  --warning:#E8A317; --warning-ink:#8A5A00; --warning-soft:#FFF4DC;
  --urgent:#D93838; --urgent-ink:#B32424; --urgent-soft:#FDEAEA;
  --work:#2F80ED; --digital:#A3D33A; --mobility:#6B7785; --leisure:#F2A93B;
  --shadow:0 12px 32px rgba(11,27,43,.08);
}
:root[data-theme="dark"] {
  --bg:#0A121C; --surface:#131E2B; --hairline:#243243; --ink:#EEF3F9; --ink2:#9FB0C2;
  --primary:#6C96FF; --primary-pressed:#4C7BF2; --on-primary:#05122B; --primary-soft:#16284A;
  --success:#45C48E; --success-ink:#6FDBA9; --success-soft:#11301F;
  --warning:#F2B93B; --warning-ink:#F2B93B; --warning-soft:#33290F;
  --urgent:#FF6B6B; --urgent-ink:#FF8A8A; --urgent-soft:#3A1717;
  --work:#5B9BF3; --digital:#B5E04F; --mobility:#94A0AE; --leisure:#F5B95A;
  --shadow:0 12px 32px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 "Inter Deva", Inter, system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif; }
h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
h1 { font-size:28px; } h2 { font-size:20px; } h3 { font-size:16px; }
p { margin:0; }
a { color:var(--primary); }
.muted { color:var(--ink2); }
.small { font-size:13px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width:1120px; margin:0 auto; padding:16px; }
.narrow { max-width:520px; }
header.top { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--hairline); }
header.top .wrap { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:10px; padding-bottom:10px; }
.brand { font-weight:700; font-size:18px; color:var(--primary); margin-right:auto; cursor:pointer; }
.brand span { color:var(--ink2); font-weight:400; font-size:14px; margin-left:6px; }
.card { background:var(--surface); border:1px solid var(--hairline); border-radius:24px; padding:20px; }
.card.hero { box-shadow:var(--shadow); }
.stack { display:flex; flex-direction:column; gap:12px; }
.stack.lg { gap:16px; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.row > .grow { flex:1 1 0; min-width:0; }
.grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
.cols { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; align-items:start; }
@media (max-width: 860px) { .cols { grid-template-columns:1fr; } }
@media (max-width: 520px) { .grid2 { grid-template-columns:1fr; } h1 { font-size:24px; } .card { padding:16px; border-radius:20px; } }
button, .btn { font:inherit; font-weight:600; border:1px solid transparent; border-radius:16px; min-height:48px; padding:10px 18px; cursor:pointer;
  background:var(--primary); color:var(--on-primary); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
button:hover, .btn:hover { background:var(--primary-pressed); }
button:disabled { opacity:.5; cursor:not-allowed; }
button.ghost, .btn.ghost { background:var(--surface); color:var(--ink); border-color:var(--hairline); }
button.ghost:hover, .btn.ghost:hover { background:var(--primary-soft); }
button.soft { background:var(--primary-soft); color:var(--primary); }
button.danger { background:var(--urgent); color:#fff; }
button.ok, .btn.ok { background:var(--success); color:#fff; }
button.ok:hover, .btn.ok:hover { background:var(--success-ink); }
button.link { background:none; color:var(--primary); border:none; min-height:0; padding:4px; }
button.sm, .btn.sm { min-height:40px; padding:6px 14px; border-radius:12px; font-size:14px; }
:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink2); font-weight:600; }
label.check { flex-direction:row; align-items:center; gap:10px; font-size:15px; color:var(--ink); font-weight:400; }
input, select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:11px 12px; width:100%; min-height:46px; }
input[type=checkbox] { width:20px; height:20px; min-height:0; accent-color:var(--primary); flex:none; }
textarea { min-height:84px; resize:vertical; }
.pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:600; white-space:nowrap; }
.pill.urgent { background:var(--urgent-soft); color:var(--urgent-ink); }
.pill.child { background:var(--warning-soft); color:var(--warning-ink); }
.pill.routine { background:var(--primary-soft); color:var(--primary); }
.pill.ok { background:var(--success-soft); color:var(--success-ink); }
.pill.grey { background:var(--bg); color:var(--ink2); border:1px solid var(--hairline); }
.tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.tab { background:var(--surface); color:var(--ink2); border:1px solid var(--hairline); border-radius:999px; min-height:44px; white-space:nowrap; }
.tab:hover { background:var(--primary-soft); }
.tab[aria-selected=true] { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
.tab.urgent[aria-selected=true] { background:var(--urgent); border-color:var(--urgent); color:#fff; }
.tab .count { background:rgba(127,127,127,.18); border-radius:999px; padding:0 8px; font-size:13px; }
.tab .dot { width:8px; height:8px; border-radius:50%; background:var(--urgent); }
.case { cursor:pointer; text-align:left; width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--hairline); border-radius:20px; padding:16px; display:block; font-weight:400; min-height:0; }
.case:hover { background:var(--surface); border-color:var(--primary); }
.case.urgent { border-left:6px solid var(--urgent); }
.case.new { box-shadow:0 0 0 2px var(--primary-soft); }
.banner { background:var(--urgent); color:#fff; border-radius:20px; padding:16px 20px; }
.banner ul { margin:6px 0 0; padding-left:20px; }
.note { background:var(--warning-soft); color:var(--warning-ink); border-radius:16px; padding:12px 16px; font-size:14px; }
.error { background:var(--urgent-soft); color:var(--urgent-ink); border-radius:12px; padding:10px 14px; font-size:14px; }
.kv { display:grid; grid-template-columns:minmax(120px, 38%) 1fr; gap:4px 12px; font-size:14px; }
.kv dt { color:var(--ink2); } .kv dd { margin:0; overflow-wrap:anywhere; }
.line { display:flex; gap:10px; align-items:flex-start; padding:4px 0; }
.dot { width:10px; height:10px; border-radius:50%; margin-top:7px; flex:none; background:var(--hairline); }
.dot.OK { background:var(--success); } .dot.WATCH { background:var(--warning); } .dot.URGENT { background:var(--urgent); }
.rings { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; text-align:center; }
@media (max-width: 520px) { .rings { grid-template-columns:repeat(2, minmax(0,1fr)); } }
.ring svg { width:76px; height:76px; }
.eye { background:var(--bg); border-radius:16px; padding:14px; }
.eye b { font-size:15px; }
.chat { display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; padding:4px; }
.msg { max-width:82%; padding:10px 14px; border-radius:16px; background:var(--bg); align-self:flex-start; overflow-wrap:anywhere; white-space:pre-wrap; }
.msg.me { background:var(--primary); color:var(--on-primary); align-self:flex-end; }
.msg.me a { color:var(--on-primary); }
.msg.sys { align-self:center; background:none; color:var(--ink2); font-size:13px; padding:2px 8px; text-align:center; }
.msg img { max-width:100%; border-radius:10px; display:block; }
.msg time { display:block; font-size:11px; opacity:.7; margin-top:2px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { border:1px solid var(--hairline); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; min-height:36px; font-weight:400; }
.chip[aria-pressed=true] { background:var(--primary-soft); border-color:var(--primary); color:var(--primary); font-weight:600; }
.chip:hover { background:var(--primary-soft); }
table.rx { width:100%; border-collapse:collapse; }
table.rx th { font-size:13px; color:var(--ink2); text-align:left; padding:4px; font-weight:600; }
table.rx td { padding:4px; }
details summary { cursor:pointer; color:var(--primary); font-weight:600; padding:6px 0; }
.avatar { width:48px; height:48px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; font-weight:700; flex:none; object-fit:cover; }
.switch { display:inline-flex; flex-direction:row; align-items:center; gap:10px; font-weight:600; font-size:14px; color:var(--ink); }
.switch input { appearance:none; width:46px; height:28px; min-height:0; border-radius:999px; background:var(--hairline); position:relative; cursor:pointer; border:none; padding:0; }
.switch input::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s; }
.switch input:checked { background:var(--success); }
.switch input:checked::after { transform:translateX(18px); }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; z-index:20; max-width:90vw; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---------- tiny DOM helper: text always goes in as text nodes, never as HTML ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked" || k === "disabled" || k === "selected") e[k] = !!v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const $app = document.getElementById("app");
const ADMIN_PAGE = location.pathname.replace(/\/$/, "").endsWith("/admin");
const KEY = ADMIN_PAGE ? "ds_admin_token" : "ds_portal_token";

// ---------- state ----------
const st = { token: localStorage.getItem(KEY), me: null, view: "queue", tab: "URGENT", cases: [], seen: null, caseId: null, c: null,
             msgs: [], lastMsg: 0, lens: null, timers: [], authMode: "login", error: null, rxOpen: false, soundOn: false };
const theme = localStorage.getItem("ds_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.documentElement.dataset.theme = theme;

// ---------- api ----------
async function api(path, opts = {}) {
  const headers = { ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(st.token ? { Authorization: "Bearer " + st.token } : {}) };
  const r = await fetch("/api" + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && st.token && !opts.auth) { logout(); throw new Error("Please log in again."); }
  if (opts.blob && r.ok) return r.blob();
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error(errText(data, r.status));
  return data;
}
function errText(data, status) {
  const d = data && data.detail;
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(x => (x.loc ? x.loc.slice(1).join(".") + ": " : "") + x.msg).join("; ");
  if (d) return JSON.stringify(d);
  return "Something went wrong (" + status + ").";
}
function logout() { localStorage.removeItem(KEY); st.token = null; st.me = null; stopTimers(); render(); }
function stopTimers() { st.timers.forEach(clearInterval); st.timers = []; }
function toast(text) { const t = h("div", { class: "toast", role: "status" }, text); document.body.append(t); setTimeout(() => t.remove(), 3500); }
function fmtTime(ms) { return new Date(ms).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); }
function ago(ms) { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
function beep() {
  if (!st.soundOn) return;
  try {
    const ctx = st.audio || (st.audio = new (window.AudioContext || window.webkitAudioContext)());
    [880, 1175].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.12, ctx.currentTime + i * .18); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i * .18 + .16);
      o.start(ctx.currentTime + i * .18); o.stop(ctx.currentTime + i * .18 + .17); });
  } catch (e) { /* no sound on this browser */ }
}

// ---------- shell ----------
function shell(...content) {
  const me = st.me;
  const themeBtn = h("button", { class: "ghost sm", "aria-label": "Switch light and dark theme", onclick: () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = t; localStorage.setItem("ds_theme", t); } }, "Light / dark");
  const bar = h("header", { class: "top" }, h("div", { class: "wrap" },
    h("div", { class: "brand", onclick: () => { if (me) go("queue"); } }, "Drishti Saathi", h("span", {}, ADMIN_PAGE ? "Admin" : "Optometrist portal")),
    me && me.role === "optometrist" && me.status === "APPROVED" ? [
      h("label", { class: "switch" }, h("input", { type: "checkbox", checked: me.available, "aria-label": "Available for new cases", onchange: async ev => {
        try { st.me = await api("/me", { method: "PATCH", body: { available: ev.target.checked } }); toast(st.me.available ? "You are available: patients can choose you." : "You are not available for new requests."); }
        catch (e) { toast(e.message); } render(); } }), me.available ? "Available" : "Not available"),
      h("button", { class: "ghost sm", onclick: () => { st.soundOn = !st.soundOn; if (st.soundOn) beep(); render(); } }, st.soundOn ? "Sound: on" : "Sound: off"),
      h("button", { class: "ghost sm", onclick: () => go("profile") }, "Profile"),
    ] : null,
    themeBtn,
    me ? h("button", { class: "ghost sm", onclick: logout }, "Log out") : null));
  $app.replaceChildren(bar, h("main", { class: "wrap stack lg" }, content));
}
function go(view, extra = {}) { stopTimers(); Object.assign(st, { view, error: null, rxOpen: false }, extra); start(); }

// ---------- auth ----------
function field(label, attrs) { return h("label", {}, label, h("input", attrs)); }
function authView() {
  const role = ADMIN_PAGE ? "admin" : "optometrist";
  const err = st.error ? h("div", { class: "error", role: "alert" }, st.error) : null;
  if (st.authMode === "register" && !ADMIN_PAGE) {
    const f = h("form", { class: "stack", onsubmit: async ev => {
      ev.preventDefault(); const d = Object.fromEntries(new FormData(f));
      const body = { name: d.name, phone: d.phone, email: d.email, password: d.password, qualification: d.qualification, registrationNo: d.registrationNo,
        clinicName: d.clinicName, city: d.city, languages: d.languages.split(",").map(x => x.trim()).filter(Boolean), fee: Number(d.fee || 0), allowWhatsapp: !!d.allowWhatsapp };
      try { const r = await api("/auth/register/optometrist", { method: "POST", body, auth: true }); signedIn(r); } catch (e) { st.error = e.message; render(); }
    } },
      h("div", { class: "grid2" }, field("Full name", { name: "name", required: true, maxlength: 80, autocomplete: "name" }), field("Mobile number", { name: "phone", required: true, inputmode: "tel", autocomplete: "tel", placeholder: "10 digits" })),
      h("div", { class: "grid2" }, field("Email", { name: "email", type: "email", required: true, autocomplete: "email" }), field("Password (8 or more characters)", { name: "password", type: "password", required: true, minlength: 8, autocomplete: "new-password" })),
      h("div", { class: "grid2" }, field("Qualification", { name: "qualification", required: true, placeholder: "e.g. B.Optom, M.Optom" }), field("Council / registration number", { name: "registrationNo", required: true })),
      h("div", { class: "grid2" }, field("Clinic name", { name: "clinicName", required: true }), field("City", { name: "city", required: true })),
      h("div", { class: "grid2" }, field("Languages (comma separated)", { name: "languages", required: true, value: "Hindi, English" }), field("Consultation fee (₹, shown to patients only)", { name: "fee", type: "number", min: 0, max: 100000, value: 0 })),
      h("label", { class: "check" }, h("input", { type: "checkbox", name: "allowWhatsapp" }), "Patients whose case I accept may message me on WhatsApp"),
      err, h("button", { type: "submit" }, "Create account"),
      h("p", { class: "muted small" }, "An admin checks your registration number before you can see cases."),
      h("button", { type: "button", class: "link", onclick: () => { st.authMode = "login"; st.error = null; render(); } }, "I already have an account"));
    return shell(h("div", { class: "card hero narrow stack", style: "margin:24px auto; max-width:760px" }, h("h1", {}, "Register as an optometrist"), f));
  }
  const f = h("form", { class: "stack", onsubmit: async ev => {
    ev.preventDefault(); const d = Object.fromEntries(new FormData(f));
    try { signedIn(await api("/auth/login", { method: "POST", body: { role, identifier: d.identifier, password: d.password }, auth: true })); } catch (e) { st.error = e.message; render(); }
  } },
    field(ADMIN_PAGE ? "Admin email" : "Mobile number or email", { name: "identifier", required: true, autocomplete: "username" }),
    field("Password", { name: "password", type: "password", required: true, autocomplete: "current-password" }),
    err, h("button", { type: "submit" }, "Log in"),
    ADMIN_PAGE ? h("a", { href: "/portal", class: "small" }, "Optometrist portal") :
      h("button", { type: "button", class: "link", onclick: () => { st.authMode = "register"; st.error = null; render(); } }, "New here? Register as an optometrist"));
  shell(h("div", { class: "card hero narrow stack", style: "margin:48px auto" },
    h("h1", {}, ADMIN_PAGE ? "Admin login" : "Optometrist login"),
    h("p", { class: "muted" }, ADMIN_PAGE ? "Approve or reject optometrist registrations." : "Review eye-screening reports from Drishti Saathi patients and consult by chat, WhatsApp or video."), f));
}
function signedIn(r) { st.token = r.token; localStorage.setItem(KEY, r.token); st.me = r.user; st.error = null; st.view = "queue"; start(); }

function pendingView() {
  const rejected = st.me.status === "REJECTED";
  shell(h("div", { class: "card hero narrow stack", style: "margin:48px auto" },
    h("span", { class: "pill " + (rejected ? "urgent" : "child") }, rejected ? "Not approved" : "Pending approval"),
    h("h1", {}, rejected ? "Your registration was not approved" : "Thank you, " + st.me.name),
    h("p", { class: "muted" }, rejected ? "Please contact the Drishti Saathi admin if you think this is a mistake."
      : "An admin is checking your registration number (" + st.me.registrationNo + "). You will see patient cases here as soon as you are approved."),
    h("button", { class: "ghost", onclick: start }, "Check again")));
  st.timers.push(setInterval(async () => { try { const me = await api("/me"); if (me.status !== st.me.status) { st.me = me; start(); } } catch (e) {} }, 10000));
}

// ---------- queue ----------
const TABS = [["URGENT", "Urgent"], ["CHILD_MYOPIA", "Child myopia"], ["ROUTINE", "Routine"], ["ACTIVE", "My active"], ["DONE", "Completed"]];
function inTab(c, tab) {
  const mine = c.optometrist && c.optometrist.id === st.me.id;
  if (tab === "ACTIVE") return mine && (c.status === "ACCEPTED" || c.status === "IN_PROGRESS");
  if (tab === "DONE") return mine && (c.status === "COMPLETED" || c.status === "CLOSED");
  return c.status === "REQUESTED" && c.priority === tab;
}
function prioPill(p) { return h("span", { class: "pill " + (p === "URGENT" ? "urgent" : p === "CHILD_MYOPIA" ? "child" : "routine") }, p === "CHILD_MYOPIA" ? "CHILD MYOPIA" : p); }
function statusPill(x) { return h("span", { class: "pill " + (x === "COMPLETED" ? "ok" : "grey") }, x.replace("_", " ")); }
async function loadQueue(first) {
  try {
    const cases = await api("/consultations");
    const open = cases.filter(c => c.status === "REQUESTED").map(c => c.id);
    if (st.seen && open.some(id => !st.seen.has(id))) { beep(); st.fresh = new Set(open.filter(id => !st.seen.has(id))); document.title = "● New case · Drishti Saathi"; }
    st.seen = new Set([...(st.seen || []), ...open]);
    st.cases = cases; st.error = null;
  } catch (e) { st.error = e.message; }
  if (st.view === "queue") queueView();
}
function queueView() {
  const count = t => st.cases.filter(c => inTab(c, t)).length;

    h("div", { class: "grid2" }, field("Clinic name", { name: "clinicName", required: true, value: me.clinicName }), field("City", { name: "city", required: true, value: me.city })),
    h("div", { class: "grid2" }, field("Languages (comma separated)", { name: "languages", required: true, value: (me.languages || []).join(", ") }), field("Consultation fee (₹, display only)", { name: "fee", type: "number", min: 0, max: 100000, value: me.fee })),
    h("label", { class: "check" }, h("input", { type: "checkbox", name: "allowWhatsapp", checked: me.allowWhatsapp }), "Patients whose case I accept may message me on WhatsApp"),
    h("dl", { class: "kv" }, h("dt", {}, "Registration no."), h("dd", {}, me.registrationNo), h("dt", {}, "Mobile"), h("dd", { class: "num" }, me.phone), h("dt", {}, "Email"), h("dd", {}, me.email), h("dt", {}, "Status"), h("dd", {}, me.status)),
    h("p", { class: "muted small" }, "Payments are not collected in this demo: the fee is shown to patients only."),
    err, h("button", { type: "submit" }, "Save profile"));
  shell(h("button", { class: "ghost sm", style: "align-self:flex-start", onclick: () => go("queue") }, "← All cases"), h("div", { class: "card hero stack", style: "max-width:760px" }, h("h1", {}, "My profile"), f));
}

// ---------- admin ----------
async function adminView() {
  let list = [], sum = null, err = null;
  try { [list, sum] = await Promise.all([api("/admin/optometrists"), api("/admin/summary")]); } catch (e) { err = e.message; }
  if (!st.token) return;
  const order = { PENDING: 0, APPROVED: 1, REJECTED: 2 };
  list.sort((a, b) => order[a.status] - order[b.status] || b.createdAt - a.createdAt);
  const setStatus = (o, what) => act(async () => { await api("/admin/optometrists/" + o.id + "/" + what, { method: "POST" }); toast(o.name + (what === "approve" ? " approved." : " rejected.")); adminView(); });
  shell(h("div", { class: "row" }, h("h1", { class: "grow" }, "Optometrist registrations"),
      sum ? h("span", { class: "muted small num" }, sum.patients + " patients · " + Object.values(sum.consultations).reduce((a, b) => a + b, 0) + " consultations") : null),
    err ? h("div", { class: "error", role: "alert" }, err) : null,
    list.length ? list.map(o => h("div", { class: "card stack" },
      h("div", { class: "row" }, h("div", { class: "grow" }, h("h2", {}, o.name, o.demo ? h("span", { class: "muted small" }, " (demo data)") : null), h("div", { class: "muted small" }, o.qualification + " · " + o.clinicName + ", " + o.city)),
        h("span", { class: "pill " + (o.status === "APPROVED" ? "ok" : o.status === "PENDING" ? "child" : "urgent") }, o.status)),
      h("dl", { class: "kv" }, h("dt", {}, "Registration no."), h("dd", {}, o.registrationNo), h("dt", {}, "Mobile"), h("dd", { class: "num" }, o.phone), h("dt", {}, "Email"), h("dd", {}, o.email),
        h("dt", {}, "Languages"), h("dd", {}, (o.languages || []).join(", ")), h("dt", {}, "Fee"), h("dd", { class: "num" }, "₹" + o.fee), h("dt", {}, "Registered"), h("dd", {}, fmtTime(o.createdAt))),
      h("div", { class: "row" }, o.status !== "APPROVED" ? h("button", { class: "ok sm", onclick: () => setStatus(o, "approve") }, "Approve") : null,
        o.status !== "REJECTED" ? h("button", { class: "ghost sm", onclick: () => setStatus(o, "reject") }, o.status === "APPROVED" ? "Remove approval" : "Reject") : null)))
      : h("div", { class: "card" }, h("p", { class: "muted" }, "No optometrist has registered yet.")));
}

// ---------- start ----------
function render() { if (!st.token || !st.me) return authView(); start(); }
async function start() {
  stopTimers();
  if (!st.token) return authView();
  if (!st.me) { try { st.me = await api("/me"); } catch (e) { return authView(); } }
  if (ADMIN_PAGE) { if (st.me.role !== "admin") { st.error = "This page is for the admin."; return logout(); } await adminView(); st.timers.push(setInterval(adminView, 15000)); return; }
  if (st.me.role !== "optometrist") { st.error = "This portal is for optometrists."; return logout(); }
  if (st.me.status !== "APPROVED") return pendingView();
  if (st.view === "case") return openCase();
  if (st.view === "profile") return profileView();
  st.view = "queue"; queueView(); await loadQueue(true);
  st.timers.push(setInterval(loadQueue, 10000));
}
document.addEventListener("click", () => { if (st.audio && st.audio.state === "suspended") st.audio.resume(); }, true);
start();
</script>
