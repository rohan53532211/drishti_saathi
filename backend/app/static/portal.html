<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drishti Saathi · Optometrist portal</title>
<style>
/* Same design language as the app (docs/DESIGN.md): Plus Jakarta Sans + Noto Sans Devanagari, the app palette,
   20 px cards, 16 px buttons, Material Symbols Rounded icons (Apache-2.0, a subset served from /portal/assets). */
@font-face { font-family: "Jakarta Deva"; src: url("/portal/assets/jakarta_deva_regular.ttf"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Jakarta Deva"; src: url("/portal/assets/jakarta_deva_semibold.ttf"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Jakarta Deva"; src: url("/portal/assets/jakarta_deva_bold.ttf"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Material Symbols Rounded"; src: url("/portal/assets/material_symbols_rounded.woff2") format("woff2"); font-weight: 400; font-display: block; }
:root {
  --bg:#F6F8FB; --surface:#FFFFFF; --surface-alt:#F0F3F8; --hairline:#E4E9F0; --ink:#0E1A2B; --ink2:#5B6B7F;
  --primary:#1F5EFF; --primary-pressed:#1546D1; --on-primary:#FFFFFF; --primary-soft:#E8EEFF; --primary-ink:#1D4ED8;
  --success:#16A34A; --success-ink:#166534; --success-soft:#E7F6EC; --on-success:#FFFFFF;
  --warning:#D97706; --warning-ink:#92400E; --warning-soft:#FEF3E2;
  --urgent:#DC2626; --urgent-ink:#B91C1C; --urgent-soft:#FDECEC; --on-urgent:#FFFFFF;
  --work:#2F80ED; --digital:#84CC16; --mobility:#64748B; --leisure:#F59E0B;
  --shadow:0 8px 24px rgba(14,26,43,.10);
  --r-card:20px; --r-btn:16px; --r-field:12px;
}
:root[data-theme="dark"] {
  --bg:#0B121C; --surface:#131D2A; --surface-alt:#1A2636; --hairline:#243243; --ink:#EEF3F9; --ink2:#9FB0C2;
  --primary:#7FA2FF; --primary-pressed:#5C86F5; --on-primary:#05122B; --primary-soft:#16284A; --primary-ink:#9DB8FF;
  --success:#4ADE80; --success-ink:#6EE7A0; --success-soft:#0F2E1C; --on-success:#05122B;
  --warning:#FBBF24; --warning-ink:#FCD34D; --warning-soft:#33270C;
  --urgent:#F87171; --urgent-ink:#FCA5A5; --urgent-soft:#3A1616; --on-urgent:#05122B;
  --work:#5B9BF3; --digital:#A3E635; --mobility:#94A3B8; --leisure:#FBBF24;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Jakarta Deva", system-ui, -apple-system, "Segoe UI", "Noto Sans Devanagari", sans-serif; }
h1,h2,h3 { margin:0; font-weight:700; letter-spacing:-.01em; text-wrap:balance; }
h1 { font-size:24px; line-height:32px; } h2 { font-size:20px; line-height:28px; } h3 { font-size:17px; line-height:24px; font-weight:600; }
p { margin:0; }
a { color:var(--primary-ink); }
.muted { color:var(--ink2); }
.small { font-size:14px; line-height:20px; }
.caption { font-size:13px; line-height:18px; color:var(--ink2); }
.num { font-variant-numeric: tabular-nums; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ms { font-family:"Material Symbols Rounded"; font-weight:normal; font-style:normal; font-size:22px; line-height:1; display:inline-block; white-space:nowrap;
  direction:ltr; -webkit-font-feature-settings:"liga"; font-feature-settings:"liga"; -webkit-font-smoothing:antialiased; flex:none;
  font-variation-settings:"FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
.ms.fill { font-variation-settings:"FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }

/* ---- layout: sidebar + top bar (signed in), centred card (sign-in pages) ---- */
.layout { display:grid; grid-template-columns:240px minmax(0,1fr); min-height:100vh; }
.side { background:var(--surface); border-right:1px solid var(--hairline); padding:20px 12px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
.side .brandrow { padding:4px 12px 20px; }
.nav { display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:10px 12px; border-radius:14px; border:none; background:none;
  color:var(--ink2); font:inherit; font-weight:600; cursor:pointer; text-align:left; justify-content:flex-start; }
.nav:hover { background:var(--surface-alt); color:var(--ink); }
.nav[aria-current="page"] { background:var(--primary-soft); color:var(--primary-ink); }
.nav .count { margin-left:auto; background:var(--surface-alt); color:var(--ink2); border-radius:999px; padding:0 9px; font-size:13px; min-width:26px; text-align:center; }
.nav .count.hot { background:var(--urgent); color:var(--on-urgent); }
.side .foot { margin-top:auto; padding:12px; }
.maincol { min-width:0; display:flex; flex-direction:column; }
.topbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:12px; padding:12px 24px; min-height:68px; flex-wrap:wrap; }
.topbar .title { margin-right:auto; display:flex; align-items:center; gap:10px; min-width:0; }
.content { padding:24px; max-width:1240px; width:100%; display:flex; flex-direction:column; gap:16px; }
.center { min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
.center .card { width:100%; max-width:480px; }
.center .card.wide { max-width:760px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; color:var(--ink); }
.brand small { display:block; font-weight:500; font-size:12px; color:var(--ink2); line-height:1.2; }
.mark { width:36px; height:36px; border-radius:11px; background:var(--primary); display:grid; place-items:center; flex:none; }
.mark svg { width:24px; height:24px; }
.mark.lg { width:56px; height:56px; border-radius:16px; } .mark.lg svg { width:36px; height:36px; }
.bottomnav { display:none; }

/* ---- surfaces ---- */
.card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-card); padding:20px; }
.card.hero { box-shadow:var(--shadow); border-color:transparent; }
.panel { background:var(--surface-alt); border-radius:14px; padding:14px; }
.stack { display:flex; flex-direction:column; gap:12px; }
.stack.lg { gap:16px; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.row > .grow { flex:1 1 0; min-width:0; }
.grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
.cols { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(340px,1fr); gap:16px; align-items:start; }
.cols > .actions { position:sticky; top:84px; }
.sectionhead { display:flex; align-items:center; gap:10px; }
.sectionhead h3 { flex:1; }

/* ---- controls ---- */
button, .btn { font:inherit; font-weight:600; border:1px solid transparent; border-radius:var(--r-btn); min-height:48px; padding:10px 18px; cursor:pointer;
  background:var(--primary); color:var(--on-primary); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s, background .12s; }
button:hover, .btn:hover { background:var(--primary-pressed); }
button:active, .btn:active { transform:scale(.98); }
button:disabled { opacity:.5; cursor:not-allowed; }
button.block, .btn.block { width:100%; min-height:56px; }
button.ghost, .btn.ghost { background:var(--surface); color:var(--ink); border-color:var(--hairline); }
button.ghost:hover, .btn.ghost:hover { background:var(--surface-alt); }
button.soft, .btn.soft { background:var(--primary-soft); color:var(--primary-ink); }
button.ok, .btn.ok { background:var(--success); color:var(--on-success); }
button.ok:hover, .btn.ok:hover { filter:brightness(.92); background:var(--success); }
button.link { background:none; color:var(--primary-ink); border:none; min-height:44px; padding:4px 8px; }
button.link:hover { text-decoration:underline; background:none; }
button.sm, .btn.sm { min-height:44px; padding:6px 14px; border-radius:12px; font-size:14px; }
button.icon { width:44px; min-height:44px; padding:0; border-radius:50%; background:transparent; color:var(--ink2); border-color:transparent; }
button.icon:hover { background:var(--surface-alt); color:var(--ink); }
:focus-visible { outline:3px solid var(--primary); outline-offset:2px; }
label { display:flex; flex-direction:column; gap:6px; font-size:14px; color:var(--ink2); font-weight:600; }
label.check { flex-direction:row; align-items:center; gap:10px; font-size:15px; color:var(--ink); font-weight:400; }
input, select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-field); padding:11px 12px; width:100%; min-height:48px; }
input:focus, textarea:focus, select:focus { border-color:var(--primary); outline:none; box-shadow:0 0 0 3px var(--primary-soft); }
input[type=checkbox] { width:20px; height:20px; min-height:0; accent-color:var(--primary); flex:none; }
textarea { min-height:84px; resize:vertical; }
.pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 12px 4px 10px; font-size:13px; font-weight:600; white-space:nowrap; line-height:20px; }
.pill .ms { font-size:16px; }
.pill.urgent { background:var(--urgent-soft); color:var(--urgent-ink); }
.pill.child { background:var(--warning-soft); color:var(--warning-ink); }
.pill.routine { background:var(--primary-soft); color:var(--primary-ink); }
.pill.ok { background:var(--success-soft); color:var(--success-ink); }
.pill.grey { background:var(--surface-alt); color:var(--ink2); }
.switch { display:inline-flex; flex-direction:row; align-items:center; gap:10px; font-weight:600; font-size:14px; color:var(--ink); min-height:44px; cursor:pointer; }
.switch input { appearance:none; width:48px; height:28px; min-height:0; border-radius:999px; background:var(--hairline); position:relative; cursor:pointer; border:none; padding:0; }
.switch input::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background:var(--success); }
.switch input:checked::after { transform:translateX(20px); }
.avatar { width:44px; height:44px; border-radius:50%; background:var(--primary-soft); color:var(--primary-ink); display:grid; place-items:center; font-weight:700; flex:none; }
.avatar.lg { width:56px; height:56px; font-size:20px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { border:1px solid var(--hairline); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 14px; font-size:14px; min-height:40px; font-weight:500; }
.chip[aria-pressed=true] { background:var(--primary-soft); border-color:var(--primary); color:var(--primary-ink); font-weight:600; }
.chip[aria-pressed=true]::before { content:"check"; font-family:"Material Symbols Rounded"; font-size:18px; -webkit-font-feature-settings:"liga"; font-feature-settings:"liga"; }
.chip:hover { background:var(--surface-alt); }
.banner { background:var(--urgent); color:var(--on-urgent); border-radius:var(--r-card); padding:18px 20px; display:flex; gap:14px; }
.banner ul { margin:6px 0 0; padding-left:20px; }
.banner .ms { font-size:28px; }
.note { background:var(--warning-soft); color:var(--ink); border-radius:16px; padding:12px 16px; font-size:14px; display:flex; gap:10px; align-items:flex-start; }
.note .ms { color:var(--warning-ink); }
.error { background:var(--urgent-soft); color:var(--ink); border-radius:12px; padding:12px 14px; font-size:14px; display:flex; gap:10px; align-items:flex-start; }
.error .ms { color:var(--urgent-ink); }
.empty { text-align:center; padding:40px 20px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.empty .ms { font-size:48px; color:var(--primary); background:var(--primary-soft); border-radius:50%; padding:20px; margin-bottom:8px; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:999px; font-size:14px; z-index:20; max-width:90vw; box-shadow:var(--shadow); }
.skel { background:var(--surface-alt); border-radius:var(--r-card); height:76px; animation:pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity:.5; } to { opacity:1; } }

/* ---- queue ---- */
.qhead, .qrow { display:grid; grid-template-columns:minmax(180px,2fr) 150px 70px 90px 120px minmax(160px,2fr); gap:12px; align-items:center; }
.qhead { padding:0 20px; font-size:13px; font-weight:600; color:var(--ink2); }
.qrow { cursor:pointer; text-align:left; width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--hairline); border-radius:var(--r-card);
  padding:14px 20px; font-weight:400; min-height:72px; }
.qrow:hover { background:var(--surface); border-color:var(--primary); }
.qrow.urgent { border-left:6px solid var(--urgent); padding-left:15px; }
.qrow.new { box-shadow:0 0 0 3px var(--primary-soft); }
.qrow .who { display:flex; align-items:center; gap:12px; min-width:0; }
.qrow .who b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qrow .reasons { color:var(--urgent-ink); font-weight:600; font-size:14px; }
.qrow .lbl { display:none; }
.group { font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink2); margin-top:8px; }
.group.urgent { color:var(--urgent-ink); }

/* ---- case ---- */
.rings { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; text-align:center; }
.ring svg { width:80px; height:80px; }
.eyes { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
.eye { background:var(--surface-alt); border-radius:16px; padding:14px 16px; }
.eye .big { font-size:24px; line-height:32px; font-weight:700; font-variant-numeric:tabular-nums; }
.line { display:flex; gap:10px; align-items:flex-start; padding:4px 0; }
.line .ms { font-size:20px; margin-top:1px; }
.line.OK .ms { color:var(--success); } .line.WATCH .ms { color:var(--warning); } .line.URGENT .ms { color:var(--urgent); }
.kv { display:grid; grid-template-columns:minmax(120px, 38%) 1fr; gap:6px 12px; font-size:14px; margin:8px 0 0; }
.kv dt { color:var(--ink2); } .kv dd { margin:0; overflow-wrap:anywhere; }
details summary { cursor:pointer; color:var(--primary-ink); font-weight:600; padding:8px 0; min-height:44px; display:flex; align-items:center; gap:6px; list-style:none; }
details summary::-webkit-details-marker { display:none; }
details summary::before { content:"expand_more"; font-family:"Material Symbols Rounded"; font-size:22px; -webkit-font-feature-settings:"liga"; font-feature-settings:"liga"; transition:transform .15s; }
details[open] summary::before { transform:rotate(180deg); }
.lensitem { display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--hairline); }
.lensitem:first-of-type { border-top:none; }
.chat { display:flex; flex-direction:column; gap:8px; height:360px; overflow-y:auto; padding:8px; background:var(--surface-alt); border-radius:16px; }
.msg { max-width:82%; padding:10px 14px; border-radius:20px 20px 20px 6px; background:var(--surface); border:1px solid var(--hairline); align-self:flex-start; overflow-wrap:anywhere; white-space:pre-wrap; }
.msg.me { background:var(--primary); color:var(--on-primary); border-color:transparent; border-radius:20px 20px 6px 20px; align-self:flex-end; }
.msg.me a { color:var(--on-primary); }
.msg.sys { align-self:center; background:none; border:none; color:var(--ink2); font-size:13px; padding:2px 8px; text-align:center; }
.msg img { max-width:100%; border-radius:12px; display:block; margin-top:4px; }
.msg time { display:block; font-size:12px; opacity:.75; margin-top:2px; text-align:right; }
.day { align-self:center; background:var(--surface); color:var(--ink2); font-size:12px; font-weight:600; border-radius:999px; padding:2px 12px; }
.composer { display:flex; gap:8px; align-items:center; }
.composer input { border-radius:999px; padding-left:18px; }
.composer button.send { width:48px; padding:0; border-radius:50%; flex:none; }

/* advice form: steppers per eye, preview */
table.rx { width:100%; border-collapse:separate; border-spacing:0 8px; }
table.rx th { font-size:13px; color:var(--ink2); text-align:left; padding:0 4px; font-weight:600; }
table.rx td { padding:0 4px; }
.stepper { display:flex; align-items:center; border:1px solid var(--hairline); border-radius:var(--r-field); background:var(--surface); overflow:hidden; }
.stepper:focus-within { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.stepper input { border:none; border-radius:0; text-align:center; padding:8px 2px; min-width:0; box-shadow:none !important; font-variant-numeric:tabular-nums; font-weight:600; -moz-appearance:textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.stepper button { background:none; color:var(--ink2); min-height:48px; width:36px; padding:0; border-radius:0; flex:none; }
.stepper button:hover { background:var(--surface-alt); color:var(--ink); }
.stepper button .ms { font-size:20px; }
.slip { border:1px solid var(--hairline); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; }
.slip table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
.slip th { font-size:13px; color:var(--ink2); font-weight:600; text-align:right; padding:4px 6px; }
.slip th:first-child, .slip td:first-child { text-align:left; }
.slip td { text-align:right; font-weight:700; font-size:17px; padding:6px; border-top:1px solid var(--hairline); }
.slip td:first-child { font-weight:500; color:var(--ink2); font-size:15px; }

/* ---- responsive: down to phone width ---- */
@media (max-width: 1080px) {
  .qhead { display:none; }
  .qrow { grid-template-columns:1fr auto; grid-template-areas:"who prio" "meta meta" "reasons reasons"; row-gap:6px; }
  .qrow .who { grid-area:who; } .qrow .prio { grid-area:prio; } .qrow .reasons { grid-area:reasons; }
  .qrow .meta { display:inline; } .qrow .metas { grid-area:meta; display:flex; gap:12px; flex-wrap:wrap; color:var(--ink2); font-size:14px; }
  .qrow .lbl { display:inline; }
  .cols { grid-template-columns:1fr; } .cols > .actions { position:static; }
}
@media (min-width: 1081px) { .qrow .metas { display:contents; } }
@media (max-width: 860px) {
  .layout { grid-template-columns:1fr; }
  .side { display:none; }
  .bottomnav { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--hairline); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .bottomnav .nav { flex-direction:column; gap:2px; font-size:12px; padding:6px 4px; min-height:56px; justify-content:center; text-align:center; }
  .bottomnav .nav .count { position:absolute; margin:0 0 0 26px; transform:translateY(-14px); font-size:11px; padding:0 6px; min-width:0; }
  .bottomnav .nav { position:relative; }
  .content { padding:16px 16px 96px; }
  .topbar { padding:10px 16px; }
  .topbar .hide-sm { display:none; }
  .topbar { flex-wrap:nowrap; gap:4px; } .topbar .title h1 { font-size:20px; line-height:28px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
}
@media (max-width: 520px) {
  .grid2, .eyes { grid-template-columns:1fr; } .rings { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .card { padding:16px; }
  h1 { font-size:22px; line-height:30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

  const pill = o => o.status === "APPROVED" ? h("span", { class: "pill ok" }, ic("check_circle"), "Approved") : o.status === "PENDING" ? h("span", { class: "pill child" }, ic("hourglass_top"), "Pending") : h("span", { class: "pill urgent" }, ic("error"), "Rejected");
  shell("Optometrist registrations",
    sum ? h("p", { class: "muted small num" }, sum.patients + " patients · " + Object.values(sum.consultations).reduce((a, b) => a + b, 0) + " consultations") : null,
    err ? errBox(err) : null,
    list.length ? list.map(o => h("div", { class: "card stack" },
      h("div", { class: "row" }, h("span", { class: "avatar", "aria-hidden": "true" }, initials(o.name)),
        h("div", { class: "grow" }, h("h3", {}, o.name, o.demo ? h("span", { class: "caption" }, " (demo data)") : null), h("div", { class: "muted small" }, o.qualification + " · " + o.clinicName + ", " + o.city)), pill(o)),
      h("dl", { class: "kv" }, h("dt", {}, "Registration no."), h("dd", {}, o.registrationNo), h("dt", {}, "Mobile"), h("dd", { class: "num" }, o.phone), h("dt", {}, "Email"), h("dd", {}, o.email),
        h("dt", {}, "Languages"), h("dd", {}, (o.languages || []).join(", ")), h("dt", {}, "Fee"), h("dd", { class: "num" }, "₹" + o.fee), h("dt", {}, "Registered"), h("dd", {}, fmtTime(o.createdAt))),
      h("div", { class: "row" }, o.status !== "APPROVED" ? h("button", { class: "ok sm", onclick: () => setStatus(o, "approve") }, ic("check_circle"), "Approve") : null,
        o.status !== "REJECTED" ? h("button", { class: "ghost sm", onclick: () => setStatus(o, "reject") }, o.status === "APPROVED" ? "Remove approval" : "Reject") : null)))
      : h("div", { class: "card empty" }, ic("person"), h("h3", {}, "No registrations yet"), h("p", { class: "muted" }, "Optometrists who register appear here for approval.")));
}

// ---------- start ----------
function render() {
  if (!st.token || !st.me) return authView();
  // redraw in place (theme, sound, availability) only on the approved optometrist's pages; everything else starts over
  const approved = !ADMIN_PAGE && st.me.role === "optometrist" && st.me.status === "APPROVED";
  if (approved && ["queue", "active", "done"].includes(st.view)) return queueView();
  if (approved && st.view === "case" && st.c) return caseView();
  start();
}
async function start() {
  stopTimers();
  if (!st.token) return authView();
  if (!st.me) { try { st.me = await api("/me"); } catch (e) { return authView(); } }
  if (ADMIN_PAGE) { if (st.me.role !== "admin") { st.error = "This page is for the admin."; return logout(); } await adminView(); st.timers.push(setInterval(adminView, 15000)); return; }
  if (st.me.role !== "optometrist") { st.error = "This portal is for optometrists."; return logout(); }
  if (st.me.status !== "APPROVED") return pendingView();
  // the case counts in the sidebar stay fresh on every page
  st.timers.push(setInterval(loadQueue, 10000));
  if (st.view === "case") { if (!st.loaded) loadQueue(); return openCase(); }
  if (st.view === "profile") { profileView(); if (!st.loaded) await loadQueue(); profileView(); return; }
  if (!["queue", "active", "done"].includes(st.view)) st.view = "queue";
  document.title = "Drishti Saathi · Optometrist portal"; st.fresh = null;
  queueView(); await loadQueue();
}
document.addEventListener("click", () => { if (st.audio && st.audio.state === "suspended") st.audio.resume(); }, true);
start();
</script>
</body>
